apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-fm.fullname" . }}
  labels:
    {{- include "k8s-fm.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "k8s-fm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-fm.selectorLabels" . | nindent 8 }}
      annotations:
        # Restart the pod when chart-managed credentials change.
        checksum/spotify: {{ toJson .Values.spotify | sha256sum }}
    spec:
      serviceAccountName: {{ include "k8s-fm.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --resync-period={{ .Values.resyncPeriod }}
            {{- if .Values.leaderElection }}
            - --leader-elect
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "k8s-fm.secretName" . }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
