{{- if not .Values.spotify.existingSecret }}
{{- $s := .Values.spotify }}
{{- if not (and $s.clientId $s.clientSecret $s.refreshToken) }}
{{- fail "set spotify.existingSecret, or all of spotify.clientId, spotify.clientSecret and spotify.refreshToken" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8s-fm.secretName" . }}
  labels:
    {{- include "k8s-fm.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPOTIFY_ID: {{ $s.clientId | quote }}
  SPOTIFY_SECRET: {{ $s.clientSecret | quote }}
  SPOTIFY_REFRESH_TOKEN: {{ $s.refreshToken | quote }}
{{- end }}
