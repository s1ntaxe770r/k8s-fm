# permissions for end users to edit playlists.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: playlist-editor-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: kates-playback
    app.kubernetes.io/part-of: kates-playback
    app.kubernetes.io/managed-by: kustomize
  name: playlist-editor-role
rules:
- apiGroups:
  - operators.gophers.jubril.xyz
  resources:
  - playlists
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - operators.gophers.jubril.xyz
  resources:
  - playlists/status
  verbs:
  - get
