---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - operators.gophers.jubril.xyz
  resources:
  - playlists
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - operators.gophers.jubril.xyz
  resources:
  - playlists/finalizers
  verbs:
  - update
- apiGroups:
  - operators.gophers.jubril.xyz
  resources:
  - playlists/status
  verbs:
  - get
  - patch
  - update
